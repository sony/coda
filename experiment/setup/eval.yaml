defaults:
  - _self_
  - dataset: voc

model_path: null

report_metrics:
  reconstruction: true
  segmentation: true

batch_size: 32
n_workers: 8

# n_samples_fid: 1000
seed: 1234
sample_size: 32
inference_steps: 100
guidance_scale: 2.0

# working diectory
work_dir: ${hydra:runtime.cwd}

# hydra configuration
hydra:
  run:
    dir: output/temp/
  sweep:
    dir: outputs/multiruns/${now:%Y-%m-%d_%H-%M-%S}
    subdir: ${hydra.job.num}